version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hll-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - hll-network

  redis:
    image: redis:7-alpine
    container_name: hll-redis-prod
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - hll-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: hll-backend-prod
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    networks:
      - hll-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${BACKEND_URL}/api/v1
    container_name: hll-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - hll-network

  nginx:
    image: nginx:alpine
    container_name: hll-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - hll-network

volumes:
  mysql_data:
  redis_data:

networks:
  hll-network:
    driver: bridge