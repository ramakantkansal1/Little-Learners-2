# Alembic Configuration
# This file is used by Alembic to configure database migrations

[alembic]
# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Set to 'true' to run the environment during the 'autogenerate' process
# This is needed for models that use SQLAlchemy's declarative base
prepend_sys_path = .

# Database URL - will be overridden by env var in env.py
sqlalchemy.url = mysql+asyncmy://hll_user:secure_app_password@localhost:3307/happy_little_learners

# Migration script location
script_location = migrations

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S