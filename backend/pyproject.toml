[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "happy-little-learners-backend"
version = "0.1.0"
description = "Happy Little Learners - Backend API for Indian Early Learning Web Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==23.0.0",
    "sqlalchemy==2.0.30",
    "asyncmy==0.2.8",
    "alembic==1.13.1",
    "redis==5.0.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "pydantic-extra-types==2.7.0",
    "email-validator==2.1.0.post1",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "httpx==0.27.0",
    "tenacity==8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==25.2.0",
    "aiosqlite==0.19.0",
    "ruff==0.4.8",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "app*",
]
exclude = [
    "migrations*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.per-file-ignores]
"tests/*" = [
    "S101",
    "S106",
]
"app/scripts/*" = []
"app/services/fix_*.py" = []
"app/services/add_recommendation_result.py" = []
"app/services/fix_responses.py" = []
"scripts/*" = []
"seed_e2e.py" = []

[tool.ruff.lint]
extend-ignore = [
    "E501",
    "B008",
    "I001",
    "W291",
    "W292",
    "W293",
    "UP031",
    "UP035",
    "F401",
    "F811",
    "F841",
    "E402",
    "UP007",
    "UP017",
    "UP035",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = [
    "py311",
]
include = "\\\\.pyi?$"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = true
no_implicit_optional = false
check_untyped_defs = false
ignore_missing_imports = true
exclude = "app/scripts/*,app/services/fix_*.py,app/services/add_recommendation_result.py,app/services/fix_responses.py,migrations/*,scripts/*"

[[tool.mypy.overrides]]
module = "app.models.*"
ignore_missing_imports = true
allow_untyped_decorators = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = [
    "app/tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [
    "app",
]
omit = [
    "app/tests/*",
    "app/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
