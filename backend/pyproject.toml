[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-little-learners-backend"
version = "0.1.0"
description = "Happy Little Learners - Backend API for Indian Early Learning Web Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==23.0.0",
    "sqlalchemy==2.0.30",
    "asyncmy==0.2.8",
    "alembic==1.13.1",
    "redis==5.0.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "pydantic-extra-types==2.7.0",
    "email-validator==2.1.0.post1",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "httpx==0.27.0",
    "tenacity==8.2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*"]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==25.2.0",
    "aiosqlite==0.19.0",
    "ruff==0.4.8",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]
per-file-ignores = { "tests/*" = ["S101", "S106"] }
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]