version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hll-mysql
    platform: linux/arm64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_password}
      MYSQL_DATABASE: ${DB_NAME:-happy_little_learners}
      MYSQL_USER: ${DB_USER:-hll_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_app_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hll-redis
    platform: linux/arm64
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hll-backend
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-happy_little_learners}
      - DB_USER=${DB_USER:-hll_user}
      - DB_PASSWORD=${DB_PASSWORD:-secure_app_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-secure_root_password}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars}
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hll-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  adminer:
    image: adminer:4.8.1
    container_name: hll-adminer
    platform: linux/arm64
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data: