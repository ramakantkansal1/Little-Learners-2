name: Phase 6 acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: e2e
      DEBUG: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: happy_little_learners_e2e
      DB_USER: hll_ci
      # Disposable, unique CI service credentials; never deployment credentials.
      DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_URL: http://localhost:5174
      BACKEND_URL: http://localhost:8001
      CORS_ORIGINS: '["http://localhost:5174"]'
      E2E_BACKEND_URL: http://localhost:8001
      E2E_FRONTEND_URL: http://localhost:5174
      API_PROXY_TARGET: http://localhost:8001
    services:
      mysql:
        image: mysql:8.0
        ports: ['3306:3306']
        env:
          MYSQL_DATABASE: happy_little_learners_e2e
          MYSQL_USER: hll_ci
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: root-${{ github.run_id }}-${{ github.run_attempt }}
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral signing secret
        run: python -c 'import secrets; print("SECRET_KEY=" + secrets.token_urlsafe(48))' >> "$GITHUB_ENV"
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrate fresh MySQL and seed pilot curriculum
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.scripts.seed_phase6
      - name: Backend regression suite
        env:
          APP_ENV: development
        working-directory: backend
        run: python -m pytest app/tests/ -q
      - name: Install and check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run typecheck:tests
          npm run lint
          npm test -- --run
          npm run build
          npx playwright install --with-deps chromium
      - name: Start APIs and frontend
        run: |
          (cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 > /tmp/phase6-api.log 2>&1) &
          (cd frontend && npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/phase6-frontend.log 2>&1) &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/v1/health/ready && curl -fsS http://localhost:5174/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Chromium and MySQL acceptance
        working-directory: frontend
        run: npx playwright test -c playwright.phase6.config.ts
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-acceptance
          path: frontend/playwright-phase6-report/
          retention-days: 3
