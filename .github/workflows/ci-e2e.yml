name: E2E CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  E2E_BACKEND_URL: http://localhost:8001
  E2E_DB_NAME: happy_little_learners_e2e
  E2E_BACKEND_URL: http://localhost:8001
  E2E_DB_NAME: happy_little_learners_e2e

jobs:
  e2e-stable:
    name: E2E Stable Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql-e2e:
        image: mysql:8.0
        ports:
          - 3308:3306
        env:
          MYSQL_ROOT_PASSWORD: e2e_root_password_123
          MYSQL_DATABASE: happy_little_learners_e2e
          MYSQL_USER: hll_user
          MYSQL_PASSWORD: secure_app_password
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start E2E backend
        working-directory: ./backend
        env:
          APP_ENV: e2e
          DEBUG: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: happy_little_learners_e2e
          DB_USER: hll_user
          DB_PASSWORD: secure_app_password
          MYSQL_ROOT_PASSWORD: e2e_root_password_123
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'your-super-secret-key-change-in-production-min-32-chars' }}
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8001
          CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for E2E backend to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8001/api/v1/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run E2E database migrations
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: happy_little_learners_e2e
          DB_USER: hll_user
          DB_PASSWORD: secure_app_password
          MYSQL_ROOT_PASSWORD: e2e_root_password_123
        run: |
          python -m alembic upgrade head

      - name: Seed E2E database
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: happy_little_learners_e2e
          DB_USER: hll_user
          DB_PASSWORD: secure_app_password
        run: python scripts/seed_e2e.py

      - name: Start frontend dev server
        working-directory: ./frontend
        env:
          E2E_MODE: 'true'
          VITE_API_URL: http://localhost:8001/api/v1
        run: |
          nohup npm run dev -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          cat /tmp/frontend.log
          exit 1

      - name: Run E2E stable tests
        working-directory: ./frontend
        env:
          E2E_BACKEND_URL: http://localhost:8001
          E2E_DB_NAME: happy_little_learners_e2e
        run: |
          npx playwright test --project=chromium --reporter=line,html --ignore="**/debug*.spec.ts"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  e2e-security:
    name: E2E Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql-e2e:
        image: mysql:8.0
        ports:
          - 3308:3306
        env:
          MYSQL_ROOT_PASSWORD: e2e_root_password_123
          MYSQL_DATABASE: happy_little_learners_e2e
          MYSQL_USER: hll_user
          MYSQL_PASSWORD: secure_app_password
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start E2E backend
        working-directory: ./backend
        env:
          APP_ENV: e2e
          DEBUG: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: happy_little_learners_e2e
          DB_USER: hll_user
          DB_PASSWORD: secure_app_password
          MYSQL_ROOT_PASSWORD: e2e_root_password_123
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'your-super-secret-key-change-in-production-min-32-chars' }}
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:8001
          CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for E2E backend to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8001/api/v1/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run E2E database migrations
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: happy_little_learners_e2e
          DB_USER: hll_user
          DB_PASSWORD: secure_app_password
        run: python -m alembic upgrade head

      - name: Seed E2E database
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: happy_little_learners_e2e
          DB_USER: hll_user
          DB_PASSWORD: secure_app_password
        run: python scripts/seed_e2e.py

      - name: Start frontend dev server
        working-directory: ./frontend
        env:
          E2E_MODE: 'true'
          VITE_API_URL: http://localhost:8001/api/v1
        run: |
          nohup npm run dev -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          cat /tmp/frontend.log
          exit 1

      - name: Run E2E security tests
        working-directory: ./frontend
        env:
          E2E_BACKEND_URL: http://localhost:8001
          E2E_DB_NAME: happy_little_learners_e2e
        run: |
          npx playwright test --project=chromium --reporter=line,html --grep="security"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-security-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-security-results
          path: frontend/test-results
          retention-days: 7

  summary:
    name: E2E CI Summary
    needs: [e2e-stable, e2e-security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.e2e-stable.result }}" != "success" ]]; then echo "E2E stable tests failed"; exit 1; fi
          if [[ "${{ needs.e2e-security.result }}" != "success" ]]; then echo "E2E security tests failed"; exit 1; fi
          echo "All E2E CI checks passed!"