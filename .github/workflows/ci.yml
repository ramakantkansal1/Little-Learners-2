name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Database
  DB_NAME: happy_little_learners
  DB_USER: hll_user
  DB_PASSWORD: secure_app_password
  MYSQL_ROOT_PASSWORD: secure_root_password
  # Application
  SECRET_KEY: ${{ secrets.SECRET_KEY || 'your-super-secret-key-change-in-production-min-32-chars' }}
  APP_ENV: development
  DEBUG: 'true'
  FRONTEND_URL: http://localhost:5173
  BACKEND_URL: http://localhost:8000
  CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
  # E2E credentials (seeded development user only — never production credentials)
  E2E_STUDENT_USERNAME: aarav_1
  E2E_STUDENT_PIN: 1234

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: python -m pytest app/tests/ -v

  frontend-tests:
    name: Frontend Tests (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend unit tests (Vitest)
        working-directory: ./frontend
        run: npx vitest run

      - name: Frontend production build
        working-directory: ./frontend
        run: npm run build

  e2e-tests:
    name: Playwright E2E Tests
    needs: [frontend-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          BACKEND_URL: ${{ env.BACKEND_URL }}
          CORS_ORIGINS: ${{ env.CORS_ORIGINS }}
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend starting..."

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+asyncmy://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@127.0.0.1:${{ env.DB_PORT }}/${{ env.DB_NAME }}?charset=utf8mb4
        run: |
          python -m alembic upgrade head

      - name: Seed database for E2E tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+asyncmy://${{ env.DB_USER }}:${{ env.DB_PASSWORD }}@127.0.0.1:${{ env.DB_PORT }}/${{ env.DB_NAME }}?charset=utf8mb4
        run: |
          python seed_e2e.py

      - name: Start frontend dev server
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
        run: |
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          echo "Frontend starting..."

      - name: Wait for frontend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        env:
          E2E_STUDENT_USERNAME: ${{ env.E2E_STUDENT_USERNAME }}
          E2E_STUDENT_PIN: ${{ env.E2E_STUDENT_PIN }}
        run: npx playwright test tests/e2e/student-login.spec.ts tests/e2e/learning-activity.spec.ts tests/e2e/navigation.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: hll-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: hll-frontend:latest
